---
name: wc-test
on:
  workflow_call:

jobs:
  integration-test:
    # Go modules are downloaded by the gomodule job in the caller workflow
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@v0.0.10

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
      - run: go run ./cmd/tfrstate find -plan-json test/foo/plan.json -backend-dir test/foo -base-dir test
